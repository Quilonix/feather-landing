<!-- The product icon exactly as it ships in the extension
     (feather/icons/icon.svg). Kept here unmodified as the canonical brand
     asset, so the store listing and this site never drift apart.

     The site's own logo is a monochrome silhouette of the same feather, because
     this page is a strict two-colour design. Same mark, different treatment. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6a5cff"/>
      <stop offset="100%" stop-color="#35c2ff"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="64" fill="url(#g)"/>
  <path d="M40 88 C40 60, 55 32, 92 24 C88 48, 78 62, 40 88 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M40 88 L60 60" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="38" y="86" width="18" height="4" rx="2" fill="#ffffff"/>
</svg>
